name: Lab2 Quiz — Android APK

on:
  push:
    branches: [main]
    paths:
      - "MOBILA/Lab2/**"
      - ".github/workflows/lab2-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MOBILA/Lab2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk AuroraQuiz.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraQuiz-apk
          path: MOBILA/Lab2/AuroraQuiz.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lab2-quiz
          name: "Квиз по ОС Аврора — Android"
          body: |
            APK собран автоматически из `MOBILA/Lab2` (коммит ${{ github.sha }}).
            Скачай `AuroraQuiz.apk` на телефон и установи (разреши установку из неизвестных источников).
          files: MOBILA/Lab2/AuroraQuiz.apk
          make_latest: true
